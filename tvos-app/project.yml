name: WordEnrichTV
options:
  bundleIdPrefix: com.wordenrich
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: KPNYT6G5XD
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TVOS_DEPLOYMENT_TARGET: "17.0"
targets:
  WordEnrichTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: WordEnrichTV
    info:
      path: WordEnrichTV/Info.plist
      properties:
        CFBundleDisplayName: Word Enrich
        LSRequiresIPhoneOS: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationLandscapeLeft
        CFBundleIcons:
          CFBundlePrimaryIcon: "App Icon"
        TVTopShelfImage:
          TVTopShelfPrimaryImage: "Top Shelf Image"
          TVTopShelfPrimaryImageWide: "Top Shelf Image Wide"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wordenrich.tv
        PRODUCT_NAME: WordEnrichTV
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
